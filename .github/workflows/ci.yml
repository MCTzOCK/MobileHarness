name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-macos:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  build-ios:
    name: Build (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true
      - name: Build for iOS
        run: xcodebuild -scheme MobileHarness -destination 'generic/platform=iOS' build

  docs:
    name: Build documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer || true
      - name: Build DocC
        run: xcodebuild -scheme MobileHarness -destination 'platform=macOS' docbuild
